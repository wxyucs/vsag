<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 484" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>HGraph 磁盘分层架构</title>
  <desc>HGraph 索引把数据拆成三部分，每部分通过一个可插拔的 IO 后端落到不同介质。base 量化码访问最频繁（热），通过 block_memory_io 留在内存；graph 邻接表访问中频（温），默认 block_memory_io 留内存，内存紧张时可换 mmap_io 下沉 SSD；precise 全精度 fp32 只在末尾精排时访问（冷），通过 async_io 或 mmap_io 下沉到 SSD。配置由 base_io_type、graph_io_type/graph_file_path、precise_io_type/precise_file_path 等扁平参数控制。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .title    { fill: #1a1a1a; font-size: 16px; font-weight: 600; }
    .subtitle { fill: #6b7280; font-size: 12px; }
    .colhead  { fill: #475569; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; }
    .main     { fill: #1f2937; font-size: 13px; font-weight: 600; }
    .sub      { fill: #6b7280; font-size: 11px; }
    .cell     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    .iocell   { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.1; }
    .mem      { fill: #eef2ff; stroke: #5c7cfa; stroke-width: 1.3; }
    .disk     { fill: #fff4e6; stroke: #e8590c; stroke-width: 1.3; }
    .mem-main { fill: #364fc7; font-size: 14px; font-weight: 700; }
    .mem-sub  { fill: #4263eb; font-size: 11px; }
    .disk-main{ fill: #c2410c; font-size: 14px; font-weight: 700; }
    .disk-sub { fill: #d9480f; font-size: 11px; }
    .iokey    { fill: #94a3b8; font-size: 11px; }
    .ioval    { fill: #334155; font-size: 12px; }
    .note-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .note     { fill: #475569; font-size: 12px; }
    .chip-hot   { fill: #ffe3e3; stroke: #fa5252; stroke-width: 1; }
    .chip-warm  { fill: #fff3bf; stroke: #fab005; stroke-width: 1; }
    .chip-cold  { fill: #e7f5ff; stroke: #4dabf7; stroke-width: 1; }
    .chip-hot-t { fill: #c92a2a; font-size: 11px; font-weight: 600; }
    .chip-warm-t{ fill: #b45309; font-size: 11px; font-weight: 600; }
    .chip-cold-t{ fill: #1971c2; font-size: 11px; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <!-- Header -->
  <text class="title"    x="40" y="40">HGraph 磁盘分层架构</text>
  <text class="subtitle" x="40" y="60">datacell → 可插拔 IO 后端 · 热数据留内存、冷数据下沉 SSD</text>

  <!-- Column headers -->
  <text class="colhead" x="166" y="96" text-anchor="middle">HGraph 数据 · datacell</text>
  <text class="colhead" x="465" y="96" text-anchor="middle">IO 后端 · *_io_type</text>
  <text class="colhead" x="692" y="96" text-anchor="middle">存储介质</text>

  <!-- ============ Row 1: base (hot → memory) ============ -->
  <rect class="cell" x="40" y="122" width="252" height="76" rx="10"/>
  <rect class="chip-hot" x="238" y="134" width="44" height="22" rx="11"/>
  <text class="chip-hot-t" x="260" y="149" text-anchor="middle">热</text>
  <text class="main" x="56" y="154">base · 量化码</text>
  <text class="sub mono" x="56" y="176">sq8 / pq / rabitq / fp16</text>

  <line x1="292" y1="160" x2="326" y2="160" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="iocell" x="330" y="122" width="270" height="76" rx="10"/>
  <text class="iokey mono" x="465" y="152" text-anchor="middle">base_io_type</text>
  <text class="ioval mono" x="465" y="174" text-anchor="middle">block_memory_io</text>

  <line x1="600" y1="160" x2="632" y2="160" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="mem" x="636" y="122" width="112" height="76" rx="10"/>
  <text class="mem-main" x="692" y="156" text-anchor="middle">内存</text>
  <text class="mem-sub"  x="692" y="176" text-anchor="middle">Memory</text>

  <!-- ============ Row 2: graph (warm → memory, optional SSD) ============ -->
  <rect class="cell" x="40" y="214" width="252" height="76" rx="10"/>
  <rect class="chip-warm" x="238" y="226" width="44" height="22" rx="11"/>
  <text class="chip-warm-t" x="260" y="241" text-anchor="middle">温</text>
  <text class="main" x="56" y="246">graph · 邻接表</text>
  <text class="sub" x="56" y="268">每点 ≤ max_degree 个邻居</text>

  <line x1="292" y1="252" x2="326" y2="252" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="iocell" x="330" y="214" width="270" height="76" rx="10"/>
  <text class="iokey mono" x="465" y="244" text-anchor="middle">graph_io_type · graph_file_path</text>
  <text class="ioval mono" x="465" y="266" text-anchor="middle">block_memory_io · mmap_io</text>

  <line x1="600" y1="252" x2="632" y2="252" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="mem" x="636" y="214" width="112" height="76" rx="10"/>
  <text class="mem-main" x="692" y="248" text-anchor="middle">内存</text>
  <text class="mem-sub"  x="692" y="268" text-anchor="middle">可选 → SSD</text>

  <!-- ============ Row 3: precise (cold → SSD) ============ -->
  <rect class="cell" x="40" y="306" width="252" height="76" rx="10"/>
  <rect class="chip-cold" x="238" y="318" width="44" height="22" rx="11"/>
  <text class="chip-cold-t" x="260" y="333" text-anchor="middle">冷</text>
  <text class="main" x="56" y="338">precise · 全精度</text>
  <text class="sub" x="56" y="360">fp32 · 仅精排末尾使用</text>

  <line x1="292" y1="344" x2="326" y2="344" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="iocell" x="330" y="306" width="270" height="76" rx="10"/>
  <text class="iokey mono" x="465" y="336" text-anchor="middle">precise_io_type · precise_file_path</text>
  <text class="ioval mono" x="465" y="358" text-anchor="middle">async_io · mmap_io</text>

  <line x1="600" y1="344" x2="632" y2="344" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="disk" x="636" y="306" width="112" height="76" rx="10"/>
  <text class="disk-main" x="692" y="340" text-anchor="middle">SSD</text>
  <text class="disk-sub"  x="692" y="360" text-anchor="middle">NVMe</text>

  <!-- ============ Legend ============ -->
  <rect class="mem" x="40" y="398" width="14" height="14" rx="3"/>
  <text class="sub" x="60" y="409">内存</text>
  <rect class="disk" x="110" y="398" width="14" height="14" rx="3"/>
  <text class="sub" x="130" y="409">磁盘 (SSD)</text>

  <text class="sub" x="218" y="409">访问频率：</text>
  <rect class="chip-hot" x="278" y="399" width="28" height="15" rx="7"/>
  <text class="chip-hot-t" x="292" y="411" text-anchor="middle">热</text>
  <text class="sub" x="312" y="409">高频</text>
  <rect class="chip-warm" x="360" y="399" width="28" height="15" rx="7"/>
  <text class="chip-warm-t" x="374" y="411" text-anchor="middle">温</text>
  <text class="sub" x="394" y="409">中频</text>
  <rect class="chip-cold" x="442" y="399" width="28" height="15" rx="7"/>
  <text class="chip-cold-t" x="456" y="411" text-anchor="middle">冷</text>
  <text class="sub" x="476" y="409">低频</text>

  <!-- ============ Takeaway note ============ -->
  <rect class="note-box" x="40" y="426" width="708" height="42" rx="8"/>
  <text class="note" x="56" y="452">推荐起步：base 留内存做导航，precise 下沉 SSD 并开启 use_reorder；内存仍紧张再把 graph 换成 mmap_io。</text>
</svg>
